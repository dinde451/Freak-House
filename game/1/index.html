    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;

      height: 100%;
      width: 0;

      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }
    .control-button-highlight:hover {
      background: #ff4c4c26;
    }
    .control-button-highlight.active {
      background: #ff4c4c59;
    }

      background: white;
    }
    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);

      padding: 4px;
      cursor: pointer;
    }

      cursor: none;
    }

      background-color: #e25b27;
