<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="955.06276" height="719.27929" viewBox="0,0,955.06276,719.27929"><g transform="translate(160.21906,120.39038)"><g stroke="none" stroke-miterlimit="10"><path d="M-160.21906,598.8889v-719.27928h955.06276v719.27929z" fill-opacity="0.50196" fill="#000000" stroke-width="0"/><image x="133.57341" y="45.47226" transform="scale(0.91422,0.91422)" width="420" height="406" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(275.13867,75.8037) rotate(7.8341) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#2b231d" stroke-width="1" font-family="Pixel" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">1923 — The Child</tspan></text><text transform="translate(207.64581,143.71673) rotate(12.1222) scale(0.43715,0.43715)" font-size="40" xml:space="preserve" fill="#2b231d" stroke-width="1" font-family="Pixel" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">The other kids won't play near </tspan><tspan x="0" dy="46.150000000000006px">the house. </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">They say it watches. </tspan><tspan x="0" dy="46.150000000000006px">Yesterday, I saw the curtains </tspan><tspan x="0" dy="46.150000000000006px">move, but no one was inside.</tspan><tspan x="0" dy="46.150000000000006px">I think it wants us to come in.</tspan></text><text transform="translate(198.05578,471.35596) scale(0.35434,0.35434)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Pixel" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Press the mouse wheel to close</tspan></text></g></g></svg>